[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transmission-line-response"
version = "0.1.0"
description = "Transmission-line S-parameter response, rise-edge, phase, and group-delay analysis utilities for analog signal paths."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "QuantumCoder" }
]
keywords = ["S-parameters", "S21", "transmission-line", "impulse-response", "group-delay", "rise-time"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "matplotlib",
  "numpy",
  "scipy",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
]

[project.scripts]
tlr-analyze-s2p = "transmission_line_response.cli:main"

[project.urls]
Homepage = "https://github.com/lidayu536/transmission-line-response"
Repository = "https://github.com/lidayu536/transmission-line-response"
Issues = "https://github.com/lidayu536/transmission-line-response/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["transmission_line_response*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]