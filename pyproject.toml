[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transmission-line-response"
version = "0.1.0"
description = "Transmission-line S-parameter response, rise-edge, phase, and group-delay analysis utilities for analog signal paths."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "QuantumCoder" }
]
dependencies = [
  "matplotlib",
  "numpy",
  "scipy",
]

[project.optional-dependencies]
dev = []

[tool.setuptools]
packages = ["transmission_line_response", "transmission_line_response.examples"]

[tool.setuptools.package-dir]
transmission_line_response = "."